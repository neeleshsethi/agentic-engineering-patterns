site_name: Agentic Engineering Patterns
site_description: >-
  A learning series on building production agent systems that fail loudly, not
  silently — state, streaming, locking, durable runs, and prompt design.
site_author: Neelesh Sethi

# The articles/ directory is the site content.
docs_dir: articles

# Update these two if the repo moves.
repo_url: https://github.com/neeleshsethi/agentic-engineering-patterns
repo_name: neeleshsethi/agentic-engineering-patterns
edit_uri: edit/main/articles/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - "Chapter 1 · Problem, design, and implementation plan": 01-problem-design-implementation-plan.md
  - "Chapter 2 · End-to-end architecture and orchestrator flow": 02-end-to-end-architecture-and-orchestrator-flow.md
  - "Step 1 · State and checkpoints": 02-state-and-checkpoints.md
  - "Step 2 · Context injection": 03-context-injection.md
  - "Step 3 · Planning and human approval": 04-planning-and-human-approval.md
  - "Step 4 · Identifiers that hold a run together": 05-identifiers.md
  - "Step 5 · Streaming and background work": 06-streaming-and-background-work.md
  - "Step 6 · Distributed locks": 07-distributed-locks.md
  - "Step 7 · Queue and worker execution": 08-queue-and-worker-execution.md
  - "Step 8 · Orchestrator prompt": 09-orchestrator-prompt.md
  - "Deep dive · Clarifications": 09a-clarifications.md
  - "Deep dive · Code components and organization": 09b-code-components-and-organization.md
  - "Interactive lessons": lessons/index.html
  - "Capstone · Nine silent failures in one agent": 10-nine-silent-failures.md
  - Reference:
      - Glossary: 00-glossary.md
      - "Source Notes (advanced)":
          - Overview: source-notes/README.md
          - Before Resume: source-notes/before-resume.md
          - The Orchestrator: source-notes/orchestrator-prompt-annotated.md
          - Life of a Deep Run: source-notes/life-of-a-deep-run.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search

# Custom styling + the interactive step-through ("scrubber") component.
# Files live under articles/assets/ so MkDocs serves them from docs_dir.
extra_css:
  - assets/scrubber.css
extra_javascript:
  - assets/scrubber.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/neeleshsethi/agentic-engineering-patterns
