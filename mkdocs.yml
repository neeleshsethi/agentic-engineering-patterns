site_name: Agentic Engineering Patterns
site_description: >-
  A learning series on building production agent systems that fail loudly, not
  silently — state, streaming, locking, durable runs, and prompt design.
site_author: Neelesh Sethi

# The articles/ directory is the site content.
docs_dir: articles

# Update these two if the repo moves.
repo_url: https://github.com/neeleshsethi/agentic-engineering-patterns
repo_name: neeleshsethi/agentic-engineering-patterns
edit_uri: edit/main/articles/

theme:
  name: material
  palette:
    - media: "(prefers-color-scheme: light)"
      scheme: default
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-night
        name: Switch to dark mode
    - media: "(prefers-color-scheme: dark)"
      scheme: slate
      primary: indigo
      accent: indigo
      toggle:
        icon: material/weather-sunny
        name: Switch to light mode
  features:
    - navigation.instant
    - navigation.tracking
    - navigation.sections
    - navigation.top
    - navigation.footer
    - toc.follow
    - search.suggest
    - search.highlight
    - content.code.copy
    - content.action.edit

nav:
  - Home: index.md
  - Start here:
      - ch1-problem-and-plan.md
      - ch2-designing-a-deep-agent.md
      - ch3-architecture-and-flow.md
  - Build it step by step:
      - step-1-state-and-checkpoints.md
      - step-2-context-injection.md
      - step-3-planning-and-human-approval.md
      - step-4-identifiers.md
      - step-5-streaming-and-background-work.md
      - bridge-dynamodb-and-sqs.md
      - step-6-distributed-locks.md
      - step-7-queue-and-worker-execution.md
      - step-7a-event-feed-and-idempotency.md
      - step-8-orchestrator-prompt.md
      - step-8a-reactive-mode-prompt.md
      - step-8b-clarifications.md
      - step-8c-plan-lifecycle.md
      - step-8d-carryover-and-data-manifest.md
      - step-8e-code-components-and-organization.md
  - Capstones:
      - capstone-1-nine-silent-failures.md
      - bridge-evaluation.md
      - capstone-2-when-the-score-passes.md
  - Appendix (optional):
      - glossary.md
      - "Interactive lessons": lessons/index.html
      - source-notes/README.md
      - source-notes/before-resume.md
      - source-notes/orchestrator-prompt-annotated.md
      - source-notes/life-of-a-deep-run.md

markdown_extensions:
  - admonition
  - attr_list
  - def_list
  - md_in_html
  - footnotes
  - toc:
      permalink: true
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
  - pymdownx.inlinehilite
  - pymdownx.snippets
  - pymdownx.details
  - pymdownx.tabbed:
      alternate_style: true

plugins:
  - search
  - redirects:
      redirect_maps:
        01-problem-design-implementation-plan.md: ch1-problem-and-plan.md
        02-end-to-end-architecture-and-orchestrator-flow.md: ch3-architecture-and-flow.md
        ch2-architecture-and-flow.md: ch3-architecture-and-flow.md
        02-state-and-checkpoints.md: step-1-state-and-checkpoints.md
        03-context-injection.md: step-2-context-injection.md
        04-planning-and-human-approval.md: step-3-planning-and-human-approval.md
        05-identifiers.md: step-4-identifiers.md
        06-streaming-and-background-work.md: step-5-streaming-and-background-work.md
        07-distributed-locks.md: step-6-distributed-locks.md
        08-queue-and-worker-execution.md: step-7-queue-and-worker-execution.md
        09e-event-feed-and-idempotency.md: step-7a-event-feed-and-idempotency.md
        09-orchestrator-prompt.md: step-8-orchestrator-prompt.md
        09d-reactive-mode-prompt.md: step-8a-reactive-mode-prompt.md
        09a-clarifications.md: step-8b-clarifications.md
        09c-plan-lifecycle.md: step-8c-plan-lifecycle.md
        09f-carryover-and-the-data-manifest.md: step-8d-carryover-and-data-manifest.md
        09b-code-components-and-organization.md: step-8e-code-components-and-organization.md
        10-nine-silent-failures.md: capstone-1-nine-silent-failures.md
        11-when-the-score-passes.md: capstone-2-when-the-score-passes.md
        00-glossary.md: glossary.md

# Single-source the interactive lessons: publish repo-root lessons/ directly,
# instead of keeping a hand-synced copy under articles/lessons/.
hooks:
  - mkdocs_hooks.py

# Custom styling + the interactive step-through ("scrubber") component.
# Files live under articles/assets/ so MkDocs serves them from docs_dir.
extra_css:
  - assets/scrubber.css
extra_javascript:
  - assets/scrubber.js

extra:
  social:
    - icon: fontawesome/brands/github
      link: https://github.com/neeleshsethi/agentic-engineering-patterns
